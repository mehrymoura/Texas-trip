<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Trailhead Manifest - Texas 2026</title>
    <style>
        :root {
            --bg-parchment: #fdfaf2;
            --leather-dark: #3e2723;
            --leather-light: #8d6e63;
            --text-dark: #2c2520;
            --marker-yellow: #fff176;
            --marker-orange: #ffb74d;
            --marker-green: #81c784;
            --marker-blue: #64b5f6;
            --marker-pink: #f06292;
            --border-color: #d7ccc8;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #f0e6df;
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Navigation Layout */
        nav {
            width: 320px;
            background-color: var(--leather-dark);
            color: #efebe9;
            padding: 20px;
            box-shadow: 3px 0 10px rgba(0,0,0,0.2);
            overflow-y: auto;
            border-right: 4px solid var(--leather-light);
        }

        nav h1 {
            font-size: 1.4rem;
            text-align: center;
            border-bottom: 2px dashed var(--leather-light);
            padding-bottom: 10px;
            color: #fff;
            text-transform: uppercase;
        }

        nav ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        nav li {
            margin: 12px 0;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        nav li:hover {
            color: var(--marker-orange);
            transform: translateX(5px);
        }

        nav .sub-item {
            padding-left: 20px;
            font-size: 0.85rem;
            opacity: 0.8;
        }

        /* Marker Badges */
        .badge {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 6px;
            border-radius: 2px;
            vertical-align: middle;
        }
        .b-yellow { background-color: var(--marker-yellow); }
        .b-orange { background-color: var(--marker-orange); }
        .b-green { background-color: var(--marker-green); }
        .b-blue { background-color: var(--marker-blue); }

        /* Main Viewport Content Area */
        main {
            flex: 1;
            background-color: var(--bg-parchment);
            padding: 40px;
            overflow-y: auto;
            max-width: 1000px;
            margin: 0 auto;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.05);
        }

        .journal-section {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .journal-section.active {
            display: block;
        }

        h2 {
            font-size: 2rem;
            border-bottom: 2px solid var(--leather-dark);
            padding-bottom: 5px;
            text-transform: uppercase;
            color: var(--leather-dark);
        }

        h3 {
            font-size: 1.3rem;
            color: var(--leather-dark);
            margin-top: 30px;
            border-bottom: 1px dashed var(--leather-light);
        }

        /* Polaroid Image Styling */
        .polaroid-snap {
            background: #fff;
            padding: 15px 15px 25px 15px;
            margin: 25px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
            border: 1px solid var(--border-color);
            max-width: 450px;
            display: block;
        }
        .polaroid-snap.tilt-left { transform: rotate(-1.5deg); }
        .polaroid-snap.tilt-right { transform: rotate(1.5deg); }
        .polaroid-snap img {
            width: 100%;
            height: auto;
            display: block;
            border: 1px solid #e0d8d0;
            background-color: #eee;
        }
        .polaroid-caption {
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            text-align: center;
            margin-top: 15px;
            color: var(--text-dark);
            font-weight: bold;
        }

        /* Interactive Mapping Engine Interface */
        .map-wrapper {
            background: #fff;
            border: 1px solid var(--border-color);
            padding: 15px;
            margin: 20px 0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .map-frame-container {
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            background-color: #e5e3df;
            border: 1px solid var(--border-color);
        }

        .map-frame-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        /* Action Buttons */
        .btn-action {
            display: inline-block;
            text-align: center;
            background-color: transparent;
            color: var(--leather-dark);
            border: 1px solid var(--leather-dark);
            padding: 6px 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 5px;
        }

        .btn-action:hover {
            background-color: var(--leather-dark);
            color: #fff;
        }

        .btn-map-download {
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
        }

        /* Custom Responsive Data Tables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #fff;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #efebe9;
            color: var(--leather-dark);
            font-weight: bold;
        }

        tr.birthday-row {
            background-color: rgba(255, 241, 118, 0.4) !important;
            font-weight: bold;
        }

        /* Checklist Formatting */
        .checklist-item {
            display: flex;
            align-items: center;
